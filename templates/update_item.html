{% extends "dashboard.html" %}

{% block title %} Update Item {% endblock %}

{% block content %}
<section class="admin-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card p-4 p-md-5">
                    <h2 class="h3 text-center mb-1">Update Menu Item</h2>
                    <p class="text-center text-muted mb-4">Editing: {{ item.name }}</p>
                    <form action="/update_menu" method="POST">
                        <input type="hidden" name="item_id" id="item_id" value="{{ item.id }}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" name="name" id="name" class="form-control" value="{{ item.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" name="price" id="price" class="form-control" value="{{ item.price }}" min="0" step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea name="description" id="description" class="form-control" rows="3" required>{{ item.description }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label for="category" class="form-label">Category</label>
                            <select name="category" id="category" class="form-select" required>
                                <option value="drinks" {% if item.category == 'drinks' %}selected{% endif %}>Drinks</option>
                                <option value="main" {% if item.category == 'main' %}selected{% endif %}>Main</option>
                                <option value="dessert" {% if item.category == 'dessert' %}selected{% endif %}>Dessert</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Update Item</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('update_menu') }}">&larr; Back to Menu Management</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
