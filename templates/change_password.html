{% extends "dashboard.html"  if session.get('role') == 'admin'  == "admin" else "base.html" %}

{% block title %} Change Password {% endblock %}

{% block content %}
<div class="container auth-page">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card auth-card p-4 p-md-5">
                <h2 class="h3 text-center mb-4">Change Password</h2>
                <form action="/change_password" method="POST">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current Password:</label>
                        <input type="password" autofocus class="form-control" name="current_password" id="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password:</label>
                        <input type="password" class="form-control" name="new_password" id="new_password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_new_password" class="form-label">Confirm New Password:</label>
                        <input type="password" class="form-control" name="confirm_new_password" id="confirm_new_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
