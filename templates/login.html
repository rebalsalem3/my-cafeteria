{% extends "layout.html" %}

{% block title %} Login {% endblock %}

{% block content %}
<div class="container auth-page">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card auth-card p-4 p-md-5">
                <h1 class="h3 text-center mb-4"> Login </h1>
                {% if error %}
                    <div class="alert alert-danger cafe-flash" role="alert">
                        <span class="cafe-flash-icon" aria-hidden="true">&#10007;</span>
                        <span class="cafe-flash-text">{{ error }}</span>
                    </div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" autofocus class="form-control" id="username" name="user_name" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
